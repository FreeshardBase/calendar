# Dev stack in the shape of the store template (app-repository apps/webcalendar/
# docker-compose.yml.template, issue #118): one bind-mounted data directory shared by all three
# services, plain HTTP to Radicale on the compose network, no published Radicale port, and every
# setting from a variable. Compose reads those variables from `.env` (cp .env.example .env);
# secrets have no default, so a missing one stops `docker compose up` before anything starts.

# Cap each container's json-file log (the daemon default is unbounded): 3 x 10 MB.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  webcalendar:
    build: .
    image: ${REGISTRY:-ghcr.io/freeshardbase}/webcalendar:${TAG:-latest}
    container_name: freeshard-webcalendar
    restart: unless-stopped
    logging: *default-logging
    # Root only until drop-privileges.sh has handed ./data to uid 1000, as on a shard (#100).
    user: "0:0"
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      caldav-server:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_PATH: /app/data/webcalendar.db
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      BASE_URL: ${BASE_URL:?set BASE_URL in .env}
      AUTH_METHOD: env
      CALDAV_USERNAME: owner
      TRUST_PROXY: "1"
      COOKIE_SECURE: "auto"
      COOKIE_SAME_SITE: "strict"
      SSL_KEY_PATH: ""
      SSL_CERT_PATH: ""
      INTERNAL_CALDAV_URL: http://caldav-server:5232
      SYSTEM_SYNC_SECRET: ${SYSTEM_SYNC_SECRET:?set SYSTEM_SYNC_SECRET in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
      INTERNAL_WEBHOOK_SECRET: ${INTERNAL_WEBHOOK_SECRET:?set INTERNAL_WEBHOOK_SECRET in .env}
      HTTP_HEADER_AUTH_SECRET: ${HTTP_HEADER_AUTH_SECRET:?set HTTP_HEADER_AUTH_SECRET in .env}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  caldav-server:
    build: ./radicale
    image: ${REGISTRY:-ghcr.io/freeshardbase}/radicale:${TAG:-latest}
    container_name: freeshard-radicale
    restart: unless-stopped
    logging: *default-logging
    user: "0:0"
    environment:
      DATABASE_PATH: /data/webcalendar.db
      RADICALE_SSL: "false"
      SYSTEM_SYNC_SECRET: ${SYSTEM_SYNC_SECRET:?set SYSTEM_SYNC_SECRET in .env}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5232/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - ./data:/data

  sync-worker:
    build: ./sync-worker
    image: ${REGISTRY:-ghcr.io/freeshardbase}/sync-worker:${TAG:-latest}
    container_name: freeshard-sync-worker
    restart: unless-stopped
    logging: *default-logging
    user: "0:0"
    depends_on:
      caldav-server:
        condition: service_healthy
    environment:
      PYTHONUNBUFFERED: "1"
      DATABASE_PATH: /data/webcalendar.db
      STATUS_ROOT: /data/vdir_status
      LOCAL_CALDAV_URL: http://caldav-server:5232
      SYSTEM_SYNC_SECRET: ${SYSTEM_SYNC_SECRET:?set SYSTEM_SYNC_SECRET in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
    volumes:
      - ./data:/data
