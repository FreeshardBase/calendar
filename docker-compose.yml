services:
  webcalendar:
    build: .
    image: ${REGISTRY:-ghcr.io/freeshardbase}/webcalendar:${TAG:-latest}
    container_name: freeshard-webcalendar
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      caldav-server:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_PATH: /app/data/webcalendar.db
      SESSION_SECRET: ${SESSION_SECRET:-freeshard-webcalendar-prod-secret-change-in-env}
      TRUST_PROXY: "true"
      COOKIE_SECURE: "auto"
      COOKIE_SAME_SITE: "strict"
      SSL_KEY_PATH: ""
      SSL_CERT_PATH: ""
      INTERNAL_CALDAV_URL: https://caldav-server:5232
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
      SYSTEM_SYNC_SECRET: ${SYSTEM_SYNC_SECRET:-super-secret-bypass}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-${ENCRYPTION_SECRET:-freeshard-default-encryption-key-do-not-use-in-prod}}
    volumes:
      - shared-data:/app/data
      - ./ssl:/app/ssl:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || wget -qO- --no-check-certificate https://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  caldav-server:
    build: ./radicale
    image: ${REGISTRY:-ghcr.io/freeshardbase}/radicale:${TAG:-latest}
    container_name: freeshard-radicale
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_PATH: /data/webcalendar.db
      SYSTEM_SYNC_SECRET: ${SYSTEM_SYNC_SECRET:-super-secret-bypass}
    healthcheck:
      test: ["CMD-SHELL", "curl -f -k https://localhost:5232/ || curl -f http://localhost:5232/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - shared-data:/data
      - ./ssl:/etc/radicale/ssl:ro

  sync-worker:
    build: ./sync-worker
    image: ${REGISTRY:-ghcr.io/freeshardbase}/sync-worker:${TAG:-latest}
    container_name: freeshard-sync-worker
    restart: unless-stopped
    depends_on:
      caldav-server:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
      DATABASE_PATH: /data/webcalendar.db
      STATUS_ROOT: /data/vdir_status
      LOCAL_CALDAV_URL: https://caldav-server:5232
      SYSTEM_SYNC_SECRET: ${SYSTEM_SYNC_SECRET:-super-secret-bypass}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-${ENCRYPTION_SECRET:-freeshard-default-encryption-key-do-not-use-in-prod}}
    volumes:
      - shared-data:/data
      - vdir-status:/data/vdir_status
      # If sync-worker needs to trust the self-signed certificate, we can mount it too
      - ./ssl:/etc/ssl/certs/local:ro

volumes:
  shared-data:
  vdir-status:
