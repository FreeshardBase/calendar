name: Mutation testing

# Manual only: this repo is private, so Actions minutes are capped, and a
# Stryker pass takes about 45 minutes. Run it on demand from the Actions tab.
on:
  workflow_dispatch:

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'      # Stryker 10 requires Node >= 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run mutation tests
        run: npm run test:mutation

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: reports/mutation/

  mutation-routes:
    # Security boundaries (auth, accounts). Not on pull_request yet: a long job there would stall every
    # fix PR. Break threshold is 0 until the first run gives a baseline; raise it then (see #357).
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: pip install -r requirements-dev.txt -r radicale/requirements.txt -r sync-worker/requirements.txt
      - run: npm run test:mutation:routes
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-routes
          path: reports/mutation-routes/
