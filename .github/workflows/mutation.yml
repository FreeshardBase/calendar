name: Mutation testing

# Manual only: a Stryker pass takes about 45 minutes (the routes pass far longer),
# too long to gate every PR. Run it on demand from the Actions tab. The results are
# in the job log (clear-text reporter); nothing is uploaded.
on:
  workflow_dispatch:

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'      # Stryker 10 requires Node >= 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run mutation tests
        run: npm run test:mutation

  mutation-routes:
    # Security boundaries (auth, accounts). Not on pull_request yet: a long job there would stall every
    # fix PR. Break threshold is 0 until the first run gives a baseline; raise it then (see #357).
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: pip install -r requirements-dev.txt -r radicale/requirements.txt -r sync-worker/requirements.txt
      - run: npm run test:mutation:routes
