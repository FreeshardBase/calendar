name: CI

# Private repo on the Free plan: Actions minutes are capped (2000/month), so CI
# runs once per PR and not again on the squash-merge push to main. Doc-only
# changes do not run it; a newer push to the same PR cancels the older run.
on:
  pull_request:
    branches: [ main ]
    paths-ignore: [ '**.md' ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: pip install -r requirements-dev.txt
      - name: Lint (syntax of every file, ESLint, ruff)
        run: npm run lint

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Install dev tools (a unit test runs npm run lint, which needs ruff)
        run: pip install -r requirements-dev.txt
      - name: Install worker dependencies (several node tests execute the Python workers)
        run: pip install -r radicale/requirements.txt -r sync-worker/requirements.txt
      - name: Unit tests (per-test timeout so a hang names the culprit)
        run: npm test
        env:
          NODE_TEST_FLAGS: --test-reporter=spec --test-timeout=120000

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install worker dependencies
        run: pip install -r radicale/requirements.txt -r sync-worker/requirements.txt
      - run: python3 -m unittest discover -s server/test/python -v

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      TZ: Europe/Berlin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start Radicale (self-signed TLS from the image entrypoint)
        run: |
          docker build -t webcalendar-radicale ./radicale
          docker run -d --name radicale -p 5232:5232 \
            -e SYSTEM_SYNC_SECRET=super-secret-bypass \
            -e DATABASE_PATH=/data/webcalendar.db \
            webcalendar-radicale
          for i in $(seq 1 30); do
            curl -sk -o /dev/null https://localhost:5232/ && exit 0
            sleep 1
          done
          docker logs radicale
          echo "Radicale did not become ready" >&2
          exit 1
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build app image (no push)
        run: docker build -t webcalendar:ci .
      - name: Build Radicale image (no push)
        run: docker build -t webcalendar-radicale:ci ./radicale
      - name: Build sync-worker image (no push)
        run: docker build -t webcalendar-sync-worker:ci ./sync-worker
